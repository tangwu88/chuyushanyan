name: chuyu-demo
services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: chuyu_demo
      MYSQL_USER: chuyu
      MYSQL_PASSWORD: chuyu_local_demo
      MYSQL_ROOT_PASSWORD: chuyu_root_demo
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '127.0.0.1:13306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uchuyu', '-pchuyu_local_demo']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chuyu_demo?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
      SERVER_ADDRESS: 0.0.0.0
      CHUYU_DEMO: 'true'
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:18080:18080'
    depends_on:
      mysql:
        condition: service_healthy
  admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: admin
    ports:
      - '127.0.0.1:15173:80'
    depends_on: [backend]
  h5:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: h5
    ports:
      - '127.0.0.1:15174:80'
    depends_on: [backend]
volumes:
  mysql-data:
